name: Gerar APK e Publicar Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android e Publicar Release
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'

      - name: Instalar plataformas do Android SDK 35
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compilar APK (assembleDebug)
        run: gradle assembleDebug

      - name: Preparar arquivo APK para distribuição
        id: prep
        run: |
          VERSION=$(grep "versionName" app/build.gradle | head -n1 | sed -E "s/.*'([^']+)'.*/\1/")
          if [ -z "$VERSION" ]; then
            VERSION="1.1.0"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/SPX-Route-OS.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/SPX-Route-OS-v${VERSION}.apk
          echo "APK preparado para versão ${VERSION}"

      - name: Salvar Artefato do APK (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: SPX-Route-OS-APK
          path: release-assets/SPX-Route-OS.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release Automático no GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v${{ steps.prep.outputs.VERSION }}
          name: "SPX Route OS v${{ steps.prep.outputs.VERSION }}"
          body: |
            ## 🚀 SPX Route OS - Versão ${{ steps.prep.outputs.VERSION }}
            
            Atualização automática compilada pelo GitHub Actions.
            
            ### 📱 Como instalar:
            1. Baixe o arquivo **`SPX-Route-OS.apk`** abaixo.
            2. Toque no arquivo baixado no seu celular Android para instalar ou atualizar.
            3. Caso o Android pergunte, autorize a instalação de fontes desconhecidas.
            
            ### ✨ Novidades desta versão:
            - **Logo Oficial com Nome**: Identidade visual completa no topo da aplicação.
            - **Exibir / Ocultar Cards**: Controle para recolher ou expandir os cards de métricas (Paradas, Pacotes, Distância e Progresso).
            - **Rua Atual & Localização em Tempo Real**: Rastreamento GPS ao vivo no mapa e nome da rua atual no painel principal.
            - **Novo Ícone do Aplicativo**: Ícone exclusivo padrão Shopee Express em alta resolução.
            - **Verificador de Atualizações Automático**: Notificação no app quando houver nova versão com opção de atualizar diretamente.
            - **Suporte a Inteligência Artificial (IA)**: Módulo integrado para assistência inteligente na rota e tratamento de endereços.
          files: |
            release-assets/SPX-Route-OS.apk
            release-assets/SPX-Route-OS-v${{ steps.prep.outputs.VERSION }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
