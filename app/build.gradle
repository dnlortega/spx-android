plugins { id 'com.android.application' }

android {
    namespace 'br.com.spxroute.app'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'io.github.dnlortega.spxandroid'
        minSdk 24
        targetSdk 36
        versionCode 15
        versionName '1.3.7'
    }

    def releaseStoreFile = System.getenv('SPX_KEYSTORE_FILE') ?: ''
    def releaseStorePassword = System.getenv('SPX_KEYSTORE_PASSWORD') ?: ''
    def releaseKeyAlias = System.getenv('SPX_KEY_ALIAS') ?: ''
    def releaseKeyPassword = System.getenv('SPX_KEY_PASSWORD') ?: ''
    def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

    def playStoreFile = System.getenv('SPX_PLAY_KEYSTORE_FILE') ?: ''
    def playStorePassword = System.getenv('SPX_PLAY_KEYSTORE_PASSWORD') ?: ''
    def playKeyAlias = System.getenv('SPX_PLAY_KEY_ALIAS') ?: ''
    def playKeyPassword = System.getenv('SPX_PLAY_KEY_PASSWORD') ?: ''
    def hasPlaySigning = playStoreFile && playStorePassword && playKeyAlias && playKeyPassword

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
        playUpload {
            if (hasPlaySigning) {
                storeFile file(playStoreFile)
                storePassword playStorePassword
                keyAlias playKeyAlias
                keyPassword playKeyPassword
                storeType System.getenv('SPX_PLAY_KEYSTORE_TYPE') ?: 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasPlaySigning ? signingConfigs.playUpload : (hasReleaseSigning ? signingConfigs.release : signingConfigs.debug)
        }
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
