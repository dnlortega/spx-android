name: Gerar APK e Publicar Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android e Publicar Release
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'

      - name: Instalar plataformas do Android SDK 36
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Configurar assinatura de lançamento
        id: signing
        env:
          SPX_KEYSTORE_BASE64: ${{ secrets.SPX_KEYSTORE_BASE64 }}
          SPX_KEYSTORE_PASSWORD: ${{ secrets.SPX_KEYSTORE_PASSWORD }}
          SPX_KEY_ALIAS: ${{ secrets.SPX_KEY_ALIAS }}
          SPX_KEY_PASSWORD: ${{ secrets.SPX_KEY_PASSWORD }}
        run: |
          if [ -n "$SPX_KEYSTORE_BASE64" ] && [ -n "$SPX_KEYSTORE_PASSWORD" ] && [ -n "$SPX_KEY_ALIAS" ] && [ -n "$SPX_KEY_PASSWORD" ]; then
            printf '%s' "$SPX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spx-release.jks"
            chmod 600 "$RUNNER_TEMP/spx-release.jks"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Assinatura estável não configurada; o build usará a chave de depuração apenas para testes."
          fi

      - name: Executar testes JavaScript
        run: node --test tests/*.test.js

      - name: Compilar APK (assembleRelease)
        env:
          SPX_KEYSTORE_FILE: ${{ steps.signing.outputs.configured == 'true' && format('{0}/spx-release.jks', runner.temp) || '' }}
          SPX_KEYSTORE_PASSWORD: ${{ secrets.SPX_KEYSTORE_PASSWORD }}
          SPX_KEY_ALIAS: ${{ secrets.SPX_KEY_ALIAS }}
          SPX_KEY_PASSWORD: ${{ secrets.SPX_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Preparar APK e metadados de atualização
        id: prep
        run: |
          VERSION=$(grep "versionName" app/build.gradle | head -n1 | sed -E "s/.*'([^']+)'.*/\1/")
          VERSION_CODE=$(grep "versionCode" app/build.gradle | head -n1 | sed -E "s/.*versionCode ([0-9]+).*/\1/")
          if [ -z "$VERSION" ] || [ -z "$VERSION_CODE" ]; then
            echo "Versão inválida em app/build.gradle" >&2
            exit 1
          fi
          APK_NAME="SPX-Route-OS-v${VERSION}.apk"
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/${APK_NAME}"
          cp "release-assets/${APK_NAME}" release-assets/SPX-Route-OS.apk
          SIGNER_SHA256=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1 | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          if ! printf '%s' "$SIGNER_SHA256" | grep -Eq '^[a-f0-9]{64}$'; then
            echo "Não foi possível identificar o certificado de assinatura do APK" >&2
            exit 1
          fi
          python3 - "$APK_NAME" "$VERSION" "$VERSION_CODE" "$SIGNER_SHA256" <<'PY'
          import hashlib
          import json
          import os
          import sys

          apk_name, version, version_code, signer_sha256 = sys.argv[1:]
          apk_path = os.path.join("release-assets", apk_name)
          digest = hashlib.sha256()
          size = 0
          with open(apk_path, "rb") as apk:
              for chunk in iter(lambda: apk.read(1024 * 1024), b""):
                  size += len(chunk)
                  digest.update(chunk)
          metadata = {
              "schemaVersion": 1,
              "repository": "dnlortega/spx-android",
              "tagName": "v" + version,
              "versionName": version,
              "versionCode": int(version_code),
              "apk": {
                  "name": apk_name,
                  "size": size,
                  "sha256": digest.hexdigest(),
                  "signerSha256": signer_sha256
              }
          }
          with open("release-assets/release-metadata.json", "w", encoding="utf-8") as output:
              json.dump(metadata, output, indent=2)
              output.write("\n")
          PY
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "APK e metadados preparados para versão ${VERSION}"

      - name: Salvar artefatos do APK
        uses: actions/upload-artifact@v4
        with:
          name: SPX-Route-OS-APK
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release automático no GitHub
        uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v${{ steps.prep.outputs.VERSION }}
          name: "SPX Route OS v${{ steps.prep.outputs.VERSION }}"
          body: |
            ## SPX Route OS - Versão ${{ steps.prep.outputs.VERSION }}

            ${{ steps.signing.outputs.configured == 'true' && 'Build assinado com o keystore estável de lançamento.' || '> **Atenção:** pré-release de teste. O atualizador instala normalmente se o certificado for igual; se for diferente, oferece reinstalação guiada com perda dos dados locais.' }}

            ### Novidades
            - Atualizador consulta as Releases recentes, inclusive pré-releases, e seleciona a versão mais recente publicada.
            - Certificado igual: instalação normal após validar SHA-256, tamanho, pacote, versão e assinatura.
            - Certificado diferente: APK validado e copiado como arquivo independente em Downloads, seguido de desinstalação confirmada e instalação manual.
            - A cópia em Downloads é verificada novamente antes da desinstalação e permanece disponível no Android 7 ou superior.
            - Metadados informam o SHA-256 do certificado de assinatura; a versão instalada é lida diretamente do Android.
            - No Android, os metadados são lidos por uma ponte nativa restrita à Release oficial, sem depender de CORS do download do GitHub.
            - Após instalar normalmente, o botão Reiniciar agora reabre o aplicativo para carregar os novos arquivos e exibir a versão correta.
            - Retomada do download após interrupções e mensagens claras para permissão, falha de rede e certificado ausente.
            - O modal de reinstalação permanece aberto depois que o APK é validado, evitando que o usuário fique sem acesso à confirmação.
            - Otimização por proximidade a partir da primeira entrega, mantendo a última entrega fixa e as prioridades.
            - Remoção da Central da Shopee como origem fixa; use GPS, ponto de partida manual ou a primeira parada.
            - Botões da barra de rota agora exibem texto e têm layout responsivo para celular.
            - Um único botão Ocultar/Exibir controla os painéis opcionais e guarda a preferência no dispositivo.
            - Reordenamento imediato da rota pelas paradas mais próximas ao escolher a primeira entrega.
            - POD opcional, sem bloquear a conclusão da entrega por falta de comprovante.
            - Conclusão imediata da entrega sem abrir a tela de comprovante e remoção do banner promocional do hub.
            - Atalhos de primeira entrega deixam de aparecer depois que a primeira parada é definida.
            - Animações leves na abertura, cartões, mapa, modais e ações, com suporte a movimento reduzido.

            ### Instalação
            Requer Android 7.0 (API 24) ou superior e Android System WebView atualizado. Permita localização de alta precisão para GPS e, no Android 8 ou superior, autorize a instalação de apps desconhecidos quando solicitado.

            1. Baixe `${{ steps.prep.outputs.APK_NAME }}` abaixo.
            2. Toque no arquivo e autorize a instalação de fontes desconhecidas, se solicitado.
            3. Pelo aplicativo, certificado igual permite instalação normal após validar o APK.
            4. Com certificado diferente, o app salva o APK validado em Downloads. Confirme a desinstalação, depois abra Downloads e toque no arquivo indicado para instalar.

            A desinstalação apaga os dados locais; exporte o que precisar antes. A versão 1.3.3 não contém o fluxo guiado, portanto a primeira migração para a 1.3.4 deve ser manual. Para atualizar sem desinstalar, conserve o mesmo keystore de lançamento. O verificador aceita somente Releases de `dnlortega/spx-android`.
          files: |
            release-assets/SPX-Route-OS.apk
            release-assets/${{ steps.prep.outputs.APK_NAME }}
            release-assets/release-metadata.json
          draft: false
          prerelease: ${{ steps.signing.outputs.configured != 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
