plugins { id 'com.android.application' }

android {
    namespace 'br.com.spxroute.app'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.spxroute.app'
        minSdk 21
        targetSdk 35
        versionCode 7
        versionName '1.2.0'
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
