plugins { id 'com.android.application' }

android {
    namespace 'br.com.spxroute.app'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.spxroute.app'
        minSdk 21
        targetSdk 35
        versionCode 15
        versionName '1.3.7'
    }

    def releaseStoreFile = System.getenv('SPX_KEYSTORE_FILE') ?: ''
    def releaseStorePassword = System.getenv('SPX_KEYSTORE_PASSWORD') ?: ''
    def releaseKeyAlias = System.getenv('SPX_KEY_ALIAS') ?: ''
    def releaseKeyPassword = System.getenv('SPX_KEY_PASSWORD') ?: ''
    def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
